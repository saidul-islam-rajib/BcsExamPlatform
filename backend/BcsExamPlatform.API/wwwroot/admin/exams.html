<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Management - BCS Exam Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .exams-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .exams-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .exams-table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .exams-table tr {
            cursor: pointer;
            transition: background 0.3s;
        }

        .exams-table tbody tr:hover {
            background: #f5f5f5;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-published {
            background: #d4edda;
            color: #155724;
        }

        .badge-draft {
            background: #fff3cd;
            color: #856404;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            overflow: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            background: white;
            margin: 30px auto;
            padding: 0;
            border-radius: 10px;
            max-width: 95%;
            max-height: 90vh;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
        }

        .modal-close {
            font-size: 32px;
            cursor: pointer;
            color: white;
            transition: opacity 0.3s;
            line-height: 1;
        }

        .modal-close:hover {
            opacity: 0.8;
        }

        .modal-body {
            padding: 30px;
            overflow-y: auto;
            flex: 1;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-card h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .info-card p {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .questions-list {
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .question-item {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background 0.3s;
        }

        .question-item:hover {
            background: #f5f5f5;
        }

        .question-item h4 {
            color: #333;
            margin-bottom: 8px;
        }

        .question-item .meta {
            color: #666;
            font-size: 13px;
        }

        .attempts-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .attempts-table th {
            background: #f9f9f9;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e0e0e0;
        }

        .attempts-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            font-size: 36px;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📋 Exam Management</h1>
            <p>View and manage all exams, questions, and student attempts</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3 id="totalExams">0</h3>
                <p>Total Exams</p>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                <h3 id="publishedExams">0</h3>
                <p>Published Exams</p>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                <h3 id="totalAttempts">0</h3>
                <p>Total Attempts</p>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <button class="btn" onclick="loadExams()">Refresh</button>
            <button class="btn" onclick="window.location.href='index.html'">Back to Admin</button>
        </div>

        <table class="exams-table">
            <thead>
                <tr>
                    <th style="width: 50px;">#</th>
                    <th>Exam Name</th>
                    <th style="width: 150px;">Date</th>
                    <th style="width: 100px;">Questions</th>
                    <th style="width: 100px;">Duration</th>
                    <th style="width: 100px;">Status</th>
                    <th style="width: 100px;">Attempts</th>
                </tr>
            </thead>
            <tbody id="examsTableBody">
                <tr>
                    <td colspan="7" class="loading">Loading exams...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Exam Detail Modal -->
    <div id="examModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="examModalTitle">Exam Details</h2>
                <span class="modal-close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="tabs">
                    <button class="tab active" onclick="showTab('overview')">Overview</button>
                    <button class="tab" onclick="showTab('questions')">Questions (200)</button>
                    <button class="tab" onclick="showTab('attempts')">Student Attempts</button>
                    <button class="tab" onclick="showTab('analytics')">Analytics</button>
                </div>

                <div id="overview" class="tab-content active">
                    <div id="examOverview"></div>
                </div>

                <div id="questions" class="tab-content">
                    <div id="examQuestions"></div>
                </div>

                <div id="attempts" class="tab-content">
                    <div id="examAttempts"></div>
                </div>

                <div id="analytics" class="tab-content">
                    <div id="examAnalytics"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:2781/api';
        let currentExamId = null;

        window.onload = async () => {
            await loadExams();
        };

        async function loadExams() {
            try {
                const response = await fetch(`${API_BASE}/admin/exams`);
                const exams = await response.json();

                // Update stats
                document.getElementById('totalExams').textContent = exams.length;
                document.getElementById('publishedExams').textContent = exams.filter(e => e.isPublished).length;

                // Get total attempts
                let totalAttempts = 0;
                for (const exam of exams) {
                    const attemptsResponse = await fetch(`${API_BASE}/exam/list`);
                    // This is a simplified count - you'd need a proper endpoint
                }
                document.getElementById('totalAttempts').textContent = totalAttempts;

                // Render table
                const tbody = document.getElementById('examsTableBody');
                tbody.innerHTML = '';

                if (exams.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="loading">No exams found</td></tr>';
                    return;
                }

                exams.forEach((exam, index) => {
                    const row = document.createElement('tr');
                    row.onclick = () => showExamDetails(exam.examId);

                    const examDate = new Date(exam.examDate).toLocaleDateString();
                    const statusClass = exam.isPublished ? 'published' : 'draft';

                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td><strong>${exam.examNameEnglish}</strong></td>
                        <td>${examDate}</td>
                        <td>${exam.totalQuestions}</td>
                        <td>${exam.durationMinutes} min</td>
                        <td><span class="badge badge-${statusClass}">${exam.isPublished ? 'Published' : 'Draft'}</span></td>
                        <td>-</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading exams:', error);
            }
        }

        async function showExamDetails(examId) {
            currentExamId = examId;
            document.getElementById('examModal').classList.add('active');

            // Load exam details
            await loadExamOverview(examId);
            await loadExamQuestions(examId);
            await loadExamAttempts(examId);
            await loadExamAnalytics(examId);
        }

        async function loadExamOverview(examId) {
            try {
                const response = await fetch(`${API_BASE}/exam/${examId}`);
                const exam = await response.json();

                document.getElementById('examModalTitle').textContent = exam.examName;

                const overviewDiv = document.getElementById('examOverview');
                overviewDiv.innerHTML = `
                    <div class="info-grid">
                        <div class="info-card">
                            <h4>Exam Name</h4>
                            <p style="font-size: 18px;">${exam.examName}</p>
                        </div>
                        <div class="info-card">
                            <h4>Exam Date</h4>
                            <p style="font-size: 18px;">${new Date(exam.examDate).toLocaleString()}</p>
                        </div>
                        <div class="info-card">
                            <h4>Total Questions</h4>
                            <p>${exam.totalQuestions}</p>
                        </div>
                        <div class="info-card">
                            <h4>Duration</h4>
                            <p>${exam.durationMinutes} min</p>
                        </div>
                        <div class="info-card">
                            <h4>Total Marks</h4>
                            <p>${exam.totalMarks}</p>
                        </div>
                        <div class="info-card">
                            <h4>Language Mode</h4>
                            <p style="font-size: 18px;">${exam.languageMode}</p>
                        </div>
                        <div class="info-card">
                            <h4>Exam Type</h4>
                            <p style="font-size: 18px;">${exam.isPaid ? 'Paid (৳' + exam.examFee + ')' : 'Free'}</p>
                        </div>
                        <div class="info-card">
                            <h4>Guest Access</h4>
                            <p style="font-size: 18px;">${exam.allowGuestUsers ? 'Allowed' : 'Not Allowed'}</p>
                        </div>
                    </div>

                    <h3 style="margin: 30px 0 15px 0; color: #667eea;">Subject Distribution</h3>
                    <div class="info-grid">
                        ${exam.subjectDistributions.map(dist => `
                            <div class="info-card">
                                <h4>${dist.subjectName}</h4>
                                <p>${dist.totalQuestions} Questions</p>
                                <div style="font-size: 13px; color: #666; margin-top: 8px;">
                                    Easy: ${dist.easyQuestions} | 
                                    Intermediate: ${dist.intermediateQuestions} | 
                                    Hard: ${dist.hardQuestions}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('Error loading exam overview:', error);
            }
        }

        async function loadExamQuestions(examId) {
            try {
                // First, start the exam to get attemptId (we'll use a dummy attempt)
                const startResponse = await fetch(`${API_BASE}/exam/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        examId: examId,
                        guestEmail: 'admin@preview.com',
                        selectedLanguage: 'English'
                    })
                });

                if (!startResponse.ok) {
                    document.getElementById('examQuestions').innerHTML = '<p class="loading">Unable to load questions. This exam may have already been attempted.</p>';
                    return;
                }

                const startData = await startResponse.json();
                const attemptId = startData.attemptId;

                // Get questions
                const questionsResponse = await fetch(`${API_BASE}/exam/questions/${attemptId}`);
                const questions = await questionsResponse.json();

                const questionsDiv = document.getElementById('examQuestions');
                questionsDiv.innerHTML = `
                    <p style="margin-bottom: 20px; color: #666;">Total Questions: ${questions.length}</p>
                    <div class="questions-list">
                        ${questions.map((q, index) => `
                            <div class="question-item">
                                <h4>Question ${index + 1}: ${q.questionText.substring(0, 100)}${q.questionText.length > 100 ? '...' : ''}</h4>
                                <div class="meta">
                                    Subject: ${q.subjectName} | 
                                    Topic: ${q.topicName} | 
                                    Difficulty: ${q.difficultyLevel} | 
                                    Marks: ${q.marks}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('Error loading exam questions:', error);
                document.getElementById('examQuestions').innerHTML = '<p class="loading">Error loading questions</p>';
            }
        }

        async function loadExamAttempts(examId) {
            const attemptsDiv = document.getElementById('examAttempts');
            attemptsDiv.innerHTML = '<p class="loading">Loading attempts...</p>';

            // Note: You'll need to create an endpoint to get attempts by exam
            attemptsDiv.innerHTML = `
                <p style="color: #666; margin-bottom: 20px;">
                    This feature requires a new API endpoint to fetch attempts by exam ID.
                    Coming soon!
                </p>
                <table class="attempts-table">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Date</th>
                            <th>Score</th>
                            <th>Percentage</th>
                            <th>Rank</th>
                            <th>Badge</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 40px; color: #999;">
                                No attempts yet or endpoint not implemented
                            </td>
                        </tr>
                    </tbody>
                </table>
            `;
        }

        async function loadExamAnalytics(examId) {
            const analyticsDiv = document.getElementById('examAnalytics');
            analyticsDiv.innerHTML = `
                <div class="info-grid">
                    <div class="info-card">
                        <h4>Total Attempts</h4>
                        <p>0</p>
                    </div>
                    <div class="info-card">
                        <h4>Average Score</h4>
                        <p>0%</p>
                    </div>
                    <div class="info-card">
                        <h4>Pass Rate</h4>
                        <p>0%</p>
                    </div>
                    <div class="info-card">
                        <h4>Highest Score</h4>
                        <p>0</p>
                    </div>
                </div>
                <p style="color: #666; margin-top: 30px;">
                    Detailed analytics will be available once students start taking this exam.
                </p>
            `;
        }

        function showTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
        }

        function closeModal() {
            document.getElementById('examModal').classList.remove('active');
        }

        // Close modal when clicking outside
        window.onclick = function (event) {
            const modal = document.getElementById('examModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>

</html>
